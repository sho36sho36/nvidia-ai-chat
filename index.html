}#img-bar{display:none;padding:6px 12px;background:#161b22;border-top:1px solid #30363d;align-items:center;gap:10px}#img-prev{max-height:64px;border-radius:6px;border:1px solid #58a6ff}.q-img{max-width:240px;max-height:200px;border-radius:8px;margin-top:6px;display:block;border:1px solid #30363d}#doc-bar{display:none;padding:6px 12px;background:#161b22;border-top:1px solid #30363d;align-items:center;gap:10px;font-size:13px;color:#79c0ff}@keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}.rec{background:#da3633!important;animation:pulse 1s infinite}</style></head><body>

<button id="tts-auto" class="sec" onclick="toggleAutoTts()" title="回答完了時に自動で読み上げ">🔇 自動読上:OFF</button><a href="/contact" target="_blank" style="background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:7px 10px;font-size:13px;text-decoration:none;font-weight:bold">📩 お問い合わせ</a><button id="adm-btn" class="sec" style="display:none" onclick="openAdmin()">👑 ユーザー管理</button>

<script>
let autoTts=false,mediaRec=null,audioChunks=[],isRec=false,curAudio=null,curTtsBtn=null;
function toggleAutoTts(){
 autoTts=!autoTts;
 const b=document.getElementById("tts-auto");
 b.textContent=autoTts?"🔊 自動読上:ON":"🔇 自動読上:OFF";
 b.style.borderColor=autoTts?"#58a6ff":"#30363d";
 if(!autoTts)stopAllAudio();
}
function cleanForSpeech(t){
 return String(t||"")
  .replace(/```[\s\S]*?```/g,"、コードブロックは省略します、")
  .replace(/\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]/g,"、数式、")
  .replace(/[#*`>|_~\[\]()]/g," ")
  .replace(/https?:\/\/\S+/g,"リンク")
  .replace(/\s+/g," ").trim();
}
function stopAllAudio(){
 if(curAudio){curAudio.pause();curAudio=null;}
 if(window.speechSynthesis)speechSynthesis.cancel();
 if(curTtsBtn){curTtsBtn.dataset.playing="0";curTtsBtn.textContent="🔊 読み上げ";curTtsBtn=null;}
}
async function speakText(btn,raw){
 const wasPlaying=(btn&&btn.dataset.playing==="1");
 stopAllAudio();
 if(wasPlaying)return;
 const txt=cleanForSpeech(raw);if(!txt)return;
 if(btn){btn.dataset.playing="1";btn.textContent="⏳ 生成中...";curTtsBtn=btn;}
 try{
  const r=await api("/api/tts",{method:"POST",body:JSON.stringify({text:txt})});
  if(!r.ok)throw new Error(await r.text());
  const blob=await r.blob();
  const url=URL.createObjectURL(blob);
  curAudio=new Audio(url);
  if(btn)btn.textContent="⏹ 停止";
  curAudio.onended=curAudio.onerror=()=>{URL.revokeObjectURL(url);stopAllAudio();};
  await curAudio.play();
 }catch(e){
  console.warn("Cartesia TTS fallback:",e);
  if(window.speechSynthesis){
   const u=new SpeechSynthesisUtterance(txt);u.lang="ja-JP";u.rate=1.05;
   if(btn)btn.textContent="⏹ 停止(標準)";
   u.onend=u.onerror=()=>stopAllAudio();
   speechSynthesis.speak(u);
  }else{stopAllAudio();}
 }
}
let recog=null;
function toggleMic(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert("このブラウザは音声認識に非対応です（Chrome / Edge / Safari推奨）");return;}
 const btn=document.getElementById("mic-btn");
 if(isRec&&recog){recog.stop();return;}
 recog=new SR();recog.lang="ja-JP";recog.interimResults=true;recog.continuous=false;
 const base=inp.value?(inp.value+" "):"";
 recog.onstart=()=>{isRec=true;btn.classList.add("rec");btn.textContent="🔴";};
 recog.onresult=e=>{
  let interim="",final="";
  for(let i=e.resultIndex;i<e.results.length;i++){
   if(e.results.item(i).isFinal)final+=e.results.item(i).item(0).transcript;
   else interim+=e.results.item(i).item(0).transcript;
  }
  inp.value=base+final+interim;
 };
 recog.onend=()=>{isRec=false;btn.classList.remove("rec");btn.textContent="🎤";inp.focus();};
 recog.onerror=()=>{isRec=false;btn.classList.remove("rec");btn.textContent="🎤";};
 recog.start();
}
let pendingDocName="",pendingDocData="";
function clearDoc(){pendingDocName="";pendingDocData="";document.getElementById("doc-bar").style.display="none";document.getElementById("doc-file").value="";}
function handleDoc(file){
 if(!file)return;
 if(file.size>10*1024*1024){alert("10MB以下のファイルを選択してください");return;}
 const r=new FileReader();
 r.onload=e=>{
  pendingDocName=file.name;
  pendingDocData=e.target.result;
  document.getElementById("doc-name").textContent="📄 添付中: "+file.name;
  document.getElementById("doc-bar").style.display="flex";
 };
 r.readAsDataURL(file);
}
let pendingImg="";
function clearImg(){pendingImg="";document.getElementById("img-bar").style.display="none";document.getElementById("img-file").value="";}
function handleImg(file){
 if(!file||!file.type.startsWith("image/"))return;
 const r=new FileReader();
 r.onload=e=>{
  const img=new Image();
  img.onload=()=>{
   const max=1024;let w=img.width,ht=img.height;
   if(w>max||ht>max){if(w>ht){ht=Math.round(ht*max/w);w=max;}else{w=Math.round(w*max/ht);ht=max;}}
   const cv=document.createElement("canvas");cv.width=w;cv.height=ht;
   cv.getContext("2d").drawImage(img,0,0,w,ht);
   pendingImg=cv.toDataURL("image/jpeg",0.85);
   document.getElementById("img-prev").src=pendingImg;
   document.getElementById("img-bar").style.display="flex";
  };
  img.src=e.target.result;
 };
 r.readAsDataURL(file);
}
inp.addEventListener("paste",e=>{
 const items=(e.clipboardData||{}).items||[];
 for(const it of items){if(it.type.startsWith("image/")){handleImg(it.getAsFile());break;}}
});
let tok=localStorage.getItem("nv_tok")||"",chats={},cid="";
const api=(p,opt={})=>fetch(p,{...opt,headers:{"Content-Type":"application/json","Authorization":tok,...(opt.headers||{})}});
const esc=s=>String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const SUP={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","+":"⁺","-":"⁻","=":"⁼","(":"⁽",")":"⁾","n":"ⁿ","i":"ⁱ","j":"ʲ","k":"ᵏ"};
const SUB={"0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉","+":"₊","-":"₋","=":"₌","(":"₍",")":"₎","a":"ₐ","e":"ₑ","h":"ₕ","i":"ᵢ","j":"ⱼ","k":"ₖ","l":"ₗ","m":"ₘ","n":"ₙ","o":"ₒ","p":"ₚ","r":"ᵣ","s":"ₛ","t":"ₜ","u":"ᵤ","v":"ᵥ","x":"ₓ"};
const MTOK=[["\\Longleftrightarrow","⇔"],["\\iff","⇔"],["\\implies","⇒"],["\\Rightarrow","⇒"],["\\Leftarrow","⇐"],["\\rightarrow","→"],["\\to","→"],["\\leftarrow","←"],["\\iiint","∭"],["\\iint","∬"],["\\oint","∮"],["\\int","∫"],["\\bigcup","⋃"],["\\bigcap","⋂"],["\\bigoplus","⨁"],["\\bigotimes","⨂"],["\\sum","∑"],["\\prod","∏"],["\\emptyset","∅"],["\\therefore","∴"],["\\because","∵"],["\\propto","∝"],["\\parallel","∥"],["\\perp","⊥"],["\\equiv","≡"],["\\approx","≈"],["\\neq","≠"],["\\leq","≤"],["\\geq","≥"],["\\sim","∼"],["\\land","∧"],["\\lor","∨"],["\\neg","¬"],["\\forall","∀"],["\\exists","∃"],["\\notin","∉"],["\\in","∈"],["\\subseteq","⊆"],["\\subset","⊂"],["\\supseteq","⊇"],["\\supset","⊃"],["\\cup","∪"],["\\cap","∩"],["\\times","×"],["\\div","÷"],["\\pm","±"],["\\mp","∓"],["\\infty","∞"],["\\partial","∂"],["\\nabla","∇"],["\\hbar","ℏ"],["\\lim","lim"],["\\langle","⟨"],["\\rangle","⟩"],["\\triangle","△"],["\\angle","∠"],["\\cdot","·"],["\\Delta","Δ"],["\\Omega","Ω"],["\\Sigma","Σ"],["\\Phi","Φ"],["\\Psi","Ψ"],["\\Lambda","Λ"],["\\Gamma","Γ"],["\\Pi","Π"],["\\Theta","Θ"],["\\alpha","α"],["\\beta","β"],["\\gamma","γ"],["\\delta","δ"],["\\epsilon","ε"],["\\zeta","ζ"],["\\eta","η"],["\\theta","θ"],["\\iota","ι"],["\\kappa","κ"],["\\lambda","λ"],["\\mu","μ"],["\\nu","ν"],["\\xi","ξ"],["\\pi","π"],["\\rho","ρ"],["\\sigma","σ"],["\\tau","τ"],["\\phi","φ"],["\\chi","χ"],["\\psi","ψ"],["\\omega","ω"],["\\mathbb{R}","ℝ"],["\\mathbb{N}","ℕ"],["\\mathbb{Z}","ℤ"],["\\mathbb{Q}","ℚ"],["\\mathbb{C}","ℂ"],["\\quad","  "],["\\left",""],["\\right",""]];
function convMath(s){
 s=s.replace(/\\begin\{(?:p|b|v|B|V)?matrix\}([\s\S]*?)\\end\{(?:p|b|v|B|V)?matrix\}/g,(_,b)=>"[ "+b.trim().split("\\\\").map(r=>r.split("&").map(c=>c.trim()).join("  ")).join(" / ")+" ]");
 for(const[k,v]of MTOK)s=s.split(k).join(v);
 s=s.replace(/\\(?:mathbf|textbf|text|mathrm|mathcal|mathfrak|mathscr)\{([^{}]+)\}/g,"$1")
  .replace(/\\vec\{([^{}]+)\}/g,"$1⃗").replace(/\\overline\{([^{}]+)\}/g,"$1̅").replace(/\\bar\{([^{}]+)\}/g,"$1̄").replace(/\\hat\{([^{}]+)\}/g,"$1̂")
  .replace(/\\binom\{([^{}]+)\}\{([^{}]+)\}/g,"($1 C $2)").replace(/\\sqrt\[3\]\{([^{}]+)\}/g,"∛($1)").replace(/\\sqrt\{([^{}]+)\}/g,"√($1)");
 for(let i=0;i<3;i++)s=s.replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g,"($1/$2)");
 s=s.replace(/\^\{([^{}]+)\}/g,(_,g)=>[...g].map(c=>SUP[c]||c).join("")).replace(/\^([0-9a-zA-Z+-])/g,(_,c)=>SUP[c]||c)
  .replace(/_\{([^{}]+)\}/g,(_,g)=>[...g].map(c=>SUB[c]||c).join("")).replace(/_([0-9a-zA-Z+-])/g,(_,c)=>SUB[c]||c);
 return s;
}
function md(src){
 const blocks=[],tables=[];
 let t=String(src||"").replace(/```([a-zA-Z0-9_+-]*)\s*\n([\s\S]*?)```/g,(_,l,c)=>{blocks.push(`<pre><code class="language-${esc(l)}">${esc(c)}</code></pre>`);return `\x00B${blocks.length-1}\x00`;});
 t=t.replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]/g,(_,a,b)=>`<span class="mblk">${esc(convMath((a||b).trim()))}</span>`)
  .replace(/\$([^$\n]+?)\$|\\\((.+?)\\\)/g,(_,a,b)=>`<span class="math">${esc(convMath((a||b).trim()))}</span>`);
 t=t.replace(/(?:^\|.+\|[ \t]*\r?\n?){2,}/gm, blk => {
  const lines = blk.trim().split(/\r?\n/).map(l => l.trim().replace(/^\|+|\|+$/g, "").split("|").map(c => c.trim()));
  const head = lines.shift();
  const sep = lines.shift();
  if (!head || !sep || !sep.every(c => /^:?-+:?$/.test(c))) return blk;
  const aligns = sep.map(c => c.startsWith(":") && c.endsWith(":") ? "center" : c.endsWith(":") ? "right" : "left");
  const th = "<tr>" + head.map((c, i) => `<th style="text-align:${aligns.at(i) || "left"}">${c}</th>`).join("") + "</tr>";
  const tb = lines.map(r => "<tr>" + r.map((c, i) => `<td style="text-align:${aligns.at(i) || "left"}">${c}</td>`).join("") + "</tr>").join("");
  tables.push(`<table><thead>${th}</thead><tbody>${tb}</tbody></table>`);
  return `\x00T${tables.length - 1}\x00`;
});t=esc(convMath(t)).replace(/&lt;span class="(mblk|math)"&gt;(.*?)&lt;\/span&gt;/g,'<span class="$1">$2</span>')
  .replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/^### (.+)$/gm,"<h3>$1</h3>").replace(/^## (.+)$/gm,"<h2>$1</h2>").replace(/^# (.+)$/gm,"<h1>$1</h1>")
  .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
  .replace(/(?:^\|.+\|[ \t]*\r?\n?){2,}/gm, blk => {
  const lines = blk.trim().split(/\r?\n/).map(l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
  const head = lines.shift();
  const sep = lines.shift();
  if (!head || !sep || !sep.every(c => /^:?-+:?$/.test(c))) return blk;
  const aligns = sep.map(c => c.startsWith(":") && c.endsWith(":") ? "center" : c.endsWith(":") ? "right" : "left");
  const th = "<tr>" + head.map((c, i) => `<th style="text-align:${aligns.at(i) || "left"}">${c}</th>`).join("") + "</tr>";
  const tb = lines.map(r => "<tr>" + r.map((c, i) => `<td style="text-align:${aligns.at(i) || "left"}">${c}</td>`).join("") + "</tr>").join("");
  return `<table><thead>${th}</thead><tbody>${tb}</tbody></table>\n`;
}).replace(/^\s*[-*] (.+)$/gm,"<ul><li>$1</li></ul>").replace(/<\/ul>\n<ul>/g,"").replace(/\n/g,"<br>");
 return t.replace(/\x00T(\d+)\x00/g,(_,i)=>tables.at(Number(i))).replace(/\x00B(\d+)\x00/g,(_,i)=>blocks.at(Number(i)));
}
const isBottom=()=>(msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight)<=30;
async function doAuth(t){
 const r=await fetch("/api/"+t,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:au.value,password:ap.value})});
 const d=await r.json(); if(!r.ok){amsg.textContent=d.detail;return;}
 if(t==="register"){amsg.textContent=d.msg;return;}
 tok=d.token;localStorage.setItem("nv_tok",tok);if(d.admin)document.getElementById("adm-btn").style.display="inline-block";
 auth.style.display="none";init();
}
function logout(){localStorage.removeItem("nv_tok");location.reload();}
async function init(){
 const mr=await api("/api/me");
 if(mr.ok){const md=await mr.json();if(md.admin)document.getElementById("adm-btn").style.display="inline-block";}
 const r=await api("/api/chats"); if(!r.ok){auth.style.display="flex";return;}
 chats=await r.json(); const ks=Object.keys(chats);
 if(!ks.length)await newChat(true); else{cid=ks.shift();renderList();renderMsgs();}
}
async function sync(){await api("/api/chats",{method:"POST",body:JSON.stringify(chats)});}
async function newChat(skip){toggleSide(false);cid="c"+Date.now().toString(36);chats[cid]={title:"新規チャット",msgs:[],turns:[]};renderList();renderMsgs();if(!skip)await sync();}
async function renChat(){const n=prompt("新しいチャット名",chats[cid].title);if(n){chats[cid].title=n;renderList();await sync();}}
async function delChat(){delete chats[cid];const ks=Object.keys(chats);if(!ks.length)await newChat();else{cid=ks.shift();renderList();renderMsgs();await sync();}}
function toggleSide(f){const s=document.getElementById("side"),o=document.getElementById("ovl");const open=f!==undefined?f:!s.classList.contains("open");s.classList.toggle("open",open);o.classList.toggle("open",open);}function renderList(){
 const q=sq.value.toLowerCase(); clist.innerHTML="";
 for(const[k,v]of Object.entries(chats)){
  const hit=!q||v.title.toLowerCase().includes(q)||v.turns.some(t=>(t.q+t.a+t.r).toLowerCase().includes(q));
  if(!hit)continue;
  const el=document.createElement("div");el.className="citem"+(k===cid?" act":"");
  el.textContent=`${v.title} (${v.turns.length})`;el.onclick=()=>{cid=k;renderList();renderMsgs();toggleSide(false);};clist.appendChild(el);
 }
}
function enhance(d){
 d.querySelectorAll("pre code").forEach((cb,i)=>{
  const bar=document.createElement("div");bar.className="cacts";
  const code=cb.textContent,cls=cb.className;
  const b1=document.createElement("button");b1.className="sec";b1.textContent="📋 コピー";b1.onclick=()=>navigator.clipboard.writeText(code);
  const b2=document.createElement("button");b2.className="sec";b2.textContent="💾 保存";b2.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([code]));a.download="code_"+(i+1)+(cls.includes("html")?".html":cls.includes("py")?".py":".txt");a.click();};
  bar.append(b1,b2);
  if(cls.includes("html")){const b3=document.createElement("button");b3.textContent="🌐 ブラウザ実行";b3.onclick=()=>window.open(URL.createObjectURL(new Blob([code],{type:"text/html"})),"_blank");bar.append(b3);}
  if(cls.includes("python")||cls.includes("py")){const out=document.createElement("pre");out.style.display="none";const b3=document.createElement("button");b3.textContent="▶ Python実行";b3.onclick=async()=>{out.style.display="block";out.textContent="実行中...";const r=await(await api("/api/exec",{method:"POST",body:JSON.stringify({code})})).json();out.textContent=(r.out||"")+(r.err?"\n[ERR]\n"+r.err:"")||"(出力なし)";};bar.append(b3);cb.parentElement.after(bar,out);return;}
  cb.parentElement.after(bar);
 });
}
function renderMsgs(){
 msgs.innerHTML="";
 (chats[cid]?.turns||[]).forEach((t,idx)=>{
  const d=document.createElement("div");d.className="turn";
  let h=`<div class="q">🧑 ${esc(t.q)} <small style="color:#8b949e">(${t.m})</small>${t.img?`<img class="q-img" src="${t.img}">`:""}</div>`;
  if(t.s?.length)h+=`<details><summary>🔍 Web検索 (${t.s.length}回)</summary>${t.s.map(x=>`<b>${esc(x.q)}</b><div class="md">${md(x.res)}</div>`).join("<hr>")}</details>`;
  if(t.r)h+=`<details><summary>🧠 思考プロセス (${t.r.length}字)</summary><div class="md">${md(t.r)}</div></details>`;
  h+=`<div class="md ans">${md(t.a)}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><div class="stat" style="margin-top:0">${t.st}</div><button class="sec" style="padding:3px 8px;font-size:12px" onclick="speakText(this, chats[cid].turns.at(${idx})?.a)">🔊 読み上げ</button></div>`;
  d.innerHTML=h;enhance(d);msgs.appendChild(d);
 });
 msgs.scrollTop=msgs.scrollHeight;
}
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
async function send(){
 const text=inp.value.trim();const imgData=pendingImg;const dName=pendingDocName;const dData=pendingDocData;if((!text&&!imgData&&!dData)||sbtn.disabled)return;clearImg();clearDoc();
 if(!cid||!chats[cid])await newChat(true);
 inp.value="";sbtn.disabled=true;
 if(!chats[cid].turns.length&&chats[cid].title==="新規チャット")chats[cid].title=text.slice(0,14);
 renderList();
 const d=document.createElement("div");d.className="turn";
 d.innerHTML=`<div class="q">🧑 ${esc((dName?"[📄 "+dName+"] ":"")+(text||(imgData?"[🖼️ 画像添付]":"")))}${imgData?`<img class="q-img" src="${imgData}">`:""}</div><details id="sdet" style="display:none"><summary id="ssum">🔍 Web検索</summary><div id="sbox" class="md"></div></details><details id="rdet" style="display:none"><summary id="rsum">🧠 思考プロセス</summary><div id="rbox" class="md" style="color:#8b949e"></div></details><div class="md ans" id="abox">⏳ 接続中...</div><div class="stat" id="stbox"></div>`;
 msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
 let rtxt="",atxt="";
 const res=await api("/api/chat_stream",{method:"POST",body:JSON.stringify({cid,text,model:msel.value,effort:esel.value,image:imgData,doc_name:dName,doc_data:dData})});
 const reader=res.body.getReader(),dec=new TextDecoder();
 while(true){
  const{done,value}=await reader.read();if(done)break;
  for(const line of dec.decode(value).split("\n")){
   if(!line.startsWith("data: "))continue;
   const btm=isBottom();
   const ev=JSON.parse(line.slice(6));
   if(ev.type==="r"){rtxt+=ev.text;rdet.style.display="block";rsum.textContent=`🧠 思考プロセス (${rtxt.length}字)`;rbox.innerHTML=md(rtxt);if(!atxt)abox.textContent="🧠 思考中...";}
   else if(ev.type==="c"){atxt+=ev.text;abox.innerHTML=md(atxt);}
   else if(ev.type==="status"){abox.textContent=ev.msg;}
   else if(ev.type==="s"){sdet.style.display="block";sbox.innerHTML+=`<b>${esc(ev.q)}</b>${md(ev.res)}<hr>`;}
   else if(ev.type==="done"){chats[cid].turns.push(ev.turn);renderList();renderMsgs();if(autoTts)speakText(null,ev.turn.a);}
   else if(ev.type==="err"){abox.textContent="❌ "+ev.msg;}
   if(btm)msgs.scrollTop=msgs.scrollHeight;
  }
 }
 sbtn.disabled=false;
}
async function openAdmin(){
 document.getElementById("adm-modal").style.display="flex";
 const us=await(await api("/api/admin/users")).json();
 ulist.innerHTML=us.map(u=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #30363d"><span>${esc(u.username)} ${u.admin?"👑":u.approved?"✅":"⏳"}</span><div>${!u.approved?`<button onclick="admAct('approve','${u.username}')">許可</button>`:""}${!u.admin?` <button class="del" onclick="admAct('del','${u.username}')">削除</button>`:""}</div></div>`).join("");
}
async function admAct(t,u){await api(t==="approve"?`/api/admin/approve/${u}`:`/api/admin/user/${u}`,{method:t==="approve"?"POST":"DELETE"});openAdmin();}
if(tok){auth.style.display="none";init();}
</script></body></html>
