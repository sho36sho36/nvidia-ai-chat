<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>お問い合わせ・要望フォーム</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px}
.wrap{max-width:760px;margin:0 auto}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:18px;margin-bottom:16px}
h2,h3{margin:0 0 12px;color:#79c0ff}
input,select,textarea,button{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:10px;font-size:15px}
input,select,textarea{width:100%;margin-bottom:10px}
textarea{min-height:110px;resize:vertical}
button{cursor:pointer;background:#238636;border:none;font-weight:bold;padding:10px 16px}
button.sec{background:#21262d;border:1px solid #30363d}
button.del{background:#da3633}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:12px;font-weight:bold}
.st-未対応{background:#da3633;color:#fff}.st-対応中{background:#d29922;color:#0d1117}.st-完了{background:#238636;color:#fff}
.reply-box{background:#0d1117;border-left:3px solid #58a6ff;padding:10px 12px;margin-top:10px;border-radius:4px;white-space:pre-wrap}
.msg-body{white-space:pre-wrap;line-height:1.6;margin:8px 0}
.meta{font-size:12px;color:#8b949e}
</style></head><body><div class="wrap">
<div class="top">
  <h2>📩 お問い合わせ・機能リクエスト</h2>
  <div style="display:flex;gap:8px">
    <a href="/" style="background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:8px 12px;text-decoration:none;font-size:13px;font-weight:bold">💬 チャットへ戻る</a>
    <button id="out-btn" class="sec" style="display:none;padding:8px 12px;font-size:13px" onclick="logout()">ログアウト</button>
  </div>
</div>

<div id="login-card" class="card" style="max-width:380px;margin:40px auto">
  <h3>🔐 お問い合わせページ ログイン</h3>
  <p class="meta" style="margin-bottom:12px">いつも利用しているアカウントでログインしてください。</p>
  <input id="cu" placeholder="ユーザー名">
  <input id="cp" type="password" placeholder="パスワード">
  <button style="width:100%" onclick="doLogin()">ログイン</button>
  <p id="lmsg" style="color:#f0883e;font-size:13px;margin-top:10px"></p>
</div>

<div id="user-view" style="display:none">
  <div class="card">
    <h3>✏️ 新規お問い合わせ・希望を送る（ログイン中: <span id="u-name"></span>）</h3>
    <select id="icat">
      <option value="新機能の希望・リクエスト">✨ 新機能の希望・リクエスト</option>
      <option value="不具合・バグ報告">🐛 不具合・バグ報告</option>
      <option value="使い方・質問">❓ 使い方・質問</option>
      <option value="その他">📝 その他</option>
    </select>
    <input id="isubj" placeholder="件名（例：〇〇のモデルを追加してほしい）">
    <textarea id="imsg" placeholder="詳しい内容や希望をご記入ください..."></textarea>
    <button onclick="sendInq()">送信する</button>
  </div>
  <div class="card">
    <h3>📋 送信済みのお問い合わせ・管理者からの返信</h3>
    <div id="u-list"></div>
  </div>
</div>

<div id="admin-view" style="display:none">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h3 style="margin:0">👑 管理者ダッシュボード（全ユーザーのお問い合わせ）</h3>
      <select id="afilter" style="width:auto;margin:0" onchange="loadInq()">
        <option value="ALL">すべて表示</option>
        <option value="未対応">未対応のみ</option>
        <option value="対応中">対応中のみ</option>
        <option value="完了">完了のみ</option>
      </select>
    </div>
    <div id="a-list"></div>
  </div>
</div>
</div>
<script>
let ctok=sessionStorage.getItem("nv_ctok")||"";
const esc=s=>String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const api=(p,opt={})=>fetch(p,{...opt,headers:{"Content-Type":"application/json","Authorization":ctok,...(opt.headers||{})}});

async function doLogin(){
 const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:cu.value,password:cp.value})});
 const d=await r.json();
 if(!r.ok){lmsg.textContent=d.detail||"ログイン失敗";return;}
 ctok=d.token;sessionStorage.setItem("nv_ctok",ctok);
 loadInq();
}
function logout(){sessionStorage.removeItem("nv_ctok");location.reload();}

async function loadInq(){
 if(!ctok)return;
 const r=await api("/api/inquiries");
 if(!r.ok){sessionStorage.removeItem("nv_ctok");ctok="";return;}
 const d=await r.json();
 document.getElementById("login-card").style.display="none";
 document.getElementById("out-btn").style.display="inline-block";
 if(d.admin){
  document.getElementById("admin-view").style.display="block";
  const flt=document.getElementById("afilter").value;
  const rows=d.items.filter(x=>flt==="ALL"||x.status===flt);
  document.getElementById("a-list").innerHTML=rows.length?rows.map(x=>`
   <div class="card" style="background:#0d1117">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px">
     <div><span class="badge st-${esc(x.status)}">${esc(x.status)}</span> <b>[${esc(x.category)}] ${esc(x.subject)}</b></div>
     <span class="meta">送信者: <b>${esc(x.user)}</b> | ${esc(x.created_at)}</span>
    </div>
    <div class="msg-body">${esc(x.message)}</div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
     <select id="st-${x.id}" style="width:130px;margin:0">
      <option value="未対応" ${x.status==="未対応"?"selected":""}>未対応</option>
      <option value="対応中" ${x.status==="対応中"?"selected":""}>対応中</option>
      <option value="完了" ${x.status==="完了"?"selected":""}>完了</option>
     </select>
     <button class="del" style="padding:8px 12px;font-size:13px;margin-left:auto" onclick="delInq('${x.id}')">削除</button>
    </div>
    <textarea id="rp-${x.id}" placeholder="管理者からの返信を入力..." style="margin-top:8px;min-height:70px">${esc(x.reply)}</textarea>
    <button onclick="saveReply('${x.id}')">💾 ステータスと返信を保存</button>
   </div>`).join(""):'<p class="meta">該当するお問い合わせはありません。</p>';
 }else{
  document.getElementById("user-view").style.display="block";
  document.getElementById("u-name").textContent=d.username;
  document.getElementById("u-list").innerHTML=d.items.length?d.items.map(x=>`
   <div class="card" style="background:#0d1117">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px">
     <div><span class="badge st-${esc(x.status)}">${esc(x.status)}</span> <b>[${esc(x.category)}] ${esc(x.subject)}</b></div>
     <span class="meta">${esc(x.created_at)}</span>
    </div>
    <div class="msg-body">${esc(x.message)}</div>
    ${x.reply?`<div class="reply-box"><b>👑 管理者からの返信 (${esc(x.updated_at)}):</b>\n${esc(x.reply)}</div>`:'<div class="meta">※ 管理者からの返信待ちです</div>'}
   </div>`).join(""):'<p class="meta">まだ送信したお問い合わせはありません。</p>';
 }
}

async function sendInq(){
 const r=await api("/api/inquiries",{method:"POST",body:JSON.stringify({category:icat.value,subject:isubj.value,message:imsg.value})});
 if(!r.ok){alert((await r.json()).detail);return;}
 isubj.value="";imsg.value="";alert("送信しました！");loadInq();
}
async function saveReply(id){
 const st=document.getElementById("st-"+id).value;
 const rp=document.getElementById("rp-"+id).value;
 const r=await api("/api/admin/inquiries/"+id,{method:"POST",body:JSON.stringify({status:st,reply:rp})});
 if(r.ok){alert("保存しました");loadInq();}
}
async function delInq(id){
 if(!confirm("このお問い合わせを削除しますか？"))return;
 await api("/api/admin/inquiries/"+id,{method:"DELETE"});loadInq();
}
if(ctok)loadInq();
</script></body></html>
